# Dependabot: avisa por PR cuando una dependencia tiene update.
# Le pedimos solo updates de seguridad para no inundar de PRs por minor bumps
# cosmeticos. Si en algun momento querés mas alerta, cambia open-pull-requests-limit.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Solo abrir PR si hay un advisory de seguridad, no por bumps de version.
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"
      - "frontend"

  # GitHub Actions tambien tiene updates de seguridad.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
